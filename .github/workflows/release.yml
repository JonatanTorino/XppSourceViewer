name: Publicar en el Marketplace

# El disparador es el tag, no un push a main: publicar es una decision
# explicita, no una consecuencia de mergear.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # para crear la Release y adjuntarle el .vsix
  id-token: write # para que GitHub emita el token OIDC del Marketplace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Los tests corren sobre Node 20 a proposito: VS Code 1.90, que es el
      # `engines.vscode` minimo declarado, ejecuta las extensiones sobre Node
      # 20. Verificar sobre un runtime mas nuevo que el real taparia justo los
      # fallos que importan.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # El tag y el manifiesto tienen que decir lo mismo. Si no, el Marketplace
      # publica una version distinta de la que el tag promete, y a partir de ahi
      # el historial de git deja de explicar que hay publicado.
      - name: Verificar que el tag coincide con package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "El tag dice $TAG y package.json dice $MANIFEST." >&2
            echo "Corregi la version del manifiesto o el tag, y volve a empezar." >&2
            exit 1
          fi

      - run: npm test

      - run: npm run compile

      # @xmldom/xmldom es dependencia de runtime, y .vscodeignore la excluye con
      # `node_modules/**` para volver a incluirla por negacion. Si el orden de
      # los patrones se la come, la extension revienta al activarse recien
      # instalada y el fallo no aparece en ninguna otra prueba.
      - name: Confirmar que @xmldom/xmldom quedo adentro
        run: |
          if ! npx --yes @vscode/vsce ls | grep -q '^node_modules/@xmldom/xmldom/'; then
            echo "@xmldom/xmldom no esta en el paquete: la extension fallaria al activarse." >&2
            exit 1
          fi

      - name: Empaquetar
        run: npx --yes @vscode/vsce package --out "transpile-to-xpp-${GITHUB_REF_NAME#v}.vsix"

      # `vsce publish --oidc` necesita Node 22 o superior. Se cambia de runtime
      # recien aca, despues de que todo lo que se verifica ya se verifico sobre
      # el Node 20 que usa el editor.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing: GitHub emite un token OIDC para la audiencia del
      # Marketplace y vsce lo canjea por una credencial efimera. No hay PAT ni
      # ningun secreto de larga vida en el repositorio.
      #
      # Requiere una politica de trusted publishing dada de alta en el portal
      # del Marketplace para este repositorio y este workflow. vsce NO cae de
      # vuelta a un PAT si el canje falla: si la politica no esta, esto corta.
      #
      # Se publica el .vsix ya construido en vez de reconstruirlo, para que lo
      # que llega al Marketplace sea exactamente el artefacto verificado arriba.
      - name: Publicar en el Marketplace
        run: npx --yes @vscode/vsce publish --oidc --packagePath "transpile-to-xpp-${GITHUB_REF_NAME#v}.vsix"

      - name: Publicar la Release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" transpile-to-xpp-*.vsix --generate-notes
